<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebOn</title>
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">WebOn</p>
        <h1>Tasks</h1>
        <p class="count" id="undoneCount" aria-live="polite">0 undone</p>
      </div>

      <div class="toolbar" aria-label="Task list and backup actions">
        <button id="chooseFileButton" type="button">Choose save file</button>
        <button id="copyLinkButton" type="button">Copy list link</button>
        <button id="createTestTaskButton" type="button">Create test task</button>
        <button id="saveFileButton" type="button">Save now</button>
        <button id="exportButton" type="button">Export JSON</button>
        <label class="file-button">
          Import JSON
          <input id="importInput" type="file" accept="application/json" />
        </label>
      </div>
    </header>

    <main>
      <section class="storage-panel" id="firstRunPanel" hidden>
        <div>
          <h2>WebOn storage file</h2>
          <p>
            Suggested backup file:
            <strong>webon-data.json</strong>
          </p>
        </div>
        <div class="storage-actions">
          <button id="firstRunChooseButton" type="button">Choose location</button>
          <button id="firstRunSkipButton" type="button">Later</button>
        </div>
      </section>

      <section class="integration-panel" aria-label="External task imports">
        <div class="integration-heading">
          <div>
            <h2>Import tasks</h2>
            <p>Bring in read-only copies from Microsoft To Do or Jira.</p>
          </div>
        </div>

        <div class="integration-grid">
          <details>
            <summary>Microsoft To Do</summary>
            <div class="integration-form">
              <label>
                Graph access token
                <input
                  id="microsoftTokenInput"
                  type="password"
                  autocomplete="off"
                  spellcheck="false"
                />
              </label>
              <button id="importMicrosoftButton" type="button">
                Import Microsoft To Do
              </button>
            </div>
          </details>

          <details>
            <summary>Jira Cloud</summary>
            <div class="integration-form">
              <label>
                Site URL
                <input
                  id="jiraSiteInput"
                  type="url"
                  placeholder="https://example.atlassian.net"
                  autocomplete="url"
                />
              </label>
              <label>
                Email
                <input id="jiraEmailInput" type="email" autocomplete="username" />
              </label>
              <label>
                API token
                <input
                  id="jiraTokenInput"
                  type="password"
                  autocomplete="off"
                  spellcheck="false"
                />
              </label>
              <label>
                Notification-like JQL
                <textarea id="jiraJqlInput" spellcheck="false">(assignee = currentUser() OR reporter = currentUser() OR creator = currentUser() OR watcher = currentUser() OR voter = currentUser()) AND resolution = Unresolved ORDER BY updated DESC</textarea>
              </label>
              <button id="importJiraButton" type="button">Import Jira</button>
            </div>
          </details>
        </div>
      </section>

      <section class="controls" aria-label="Task filters">
        <div class="segmented" role="group" aria-label="Filter tasks">
          <button class="filter-button is-active" type="button" data-filter="all">
            All
          </button>
          <button class="filter-button" type="button" data-filter="todo">
            To-do
          </button>
          <button class="filter-button" type="button" data-filter="done">
            Done
          </button>
        </div>

        <label class="archive-toggle">
          <input id="showArchivedInput" type="checkbox" />
          Show archived
        </label>
      </section>

      <p class="status" id="status" aria-live="polite"></p>

      <ul class="task-list" id="taskList"></ul>
      <section class="empty-state" id="emptyState" hidden aria-live="polite">
        <div class="empty-mark" aria-hidden="true">WebOn</div>
        <h2 id="emptyTitle">No tasks yet</h2>
        <p id="emptyMessage">Captured pages and selections will appear here.</p>
      </section>
    </main>

    <template id="taskTemplate">
      <li class="task-card">
        <div class="task-row">
          <label class="done-control">
            <input class="done-checkbox" type="checkbox" />
            <span class="visually-hidden">Done</span>
          </label>

          <div class="task-content">
            <div class="task-topline">
              <h2 class="task-title"></h2>
              <div class="task-actions">
                <button class="move-up" type="button">Up</button>
                <button class="move-down" type="button">Down</button>
                <button class="archive-button" type="button">Archive</button>
              </div>
            </div>

            <dl class="task-meta">
              <div>
                <dt>Due</dt>
                <dd class="task-due"></dd>
              </div>
              <div>
                <dt>Created</dt>
                <dd class="task-created"></dd>
              </div>
            </dl>

            <p class="task-notes"></p>

            <div class="source-line">
              <a class="source-link" target="_blank" rel="noreferrer"></a>
            </div>
          </div>

          <button class="thumbnail-button" type="button" hidden>
            <img class="screenshot" alt="Visible page screenshot" />
          </button>
        </div>
      </li>
    </template>

    <dialog id="screenshotDialog" class="screenshot-dialog">
      <form method="dialog">
        <button type="submit" class="dialog-close">Close</button>
      </form>
      <img id="dialogImage" alt="Full screenshot" />
    </dialog>
  </body>
</html>
